<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Editor</title>
<style>
:root {
  --bg: #181818; --panel: #202020; --raise: #2a2a2a; --line: #333; --ink: #b9b9b9; --bright: #f0f0f0;
  --dim: #787878; --sel: #34404c; --accent: #e0c060; --bad: #e1463c; --good: #78c878;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 13px/1.4 ui-monospace, "DejaVu Sans Mono", Menlo, monospace; }
button, input, select { font: inherit; color: var(--bright); background: var(--raise); border: 1px solid var(--line);
  border-radius: 3px; padding: 3px 7px; }
button { cursor: pointer; }
button:hover { border-color: var(--dim); }
button.on { border-color: var(--accent); color: var(--accent); }
button:disabled { color: var(--dim); cursor: default; }
input:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); }
#app { display: grid; grid-template-columns: 230px 1fr; height: 100vh; }

/* Every sound, by section. */
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
#side .top { padding: 10px; border-bottom: 1px solid var(--line); }
#side h2 { margin: 0; font-size: 14px; font-weight: normal; color: var(--bright); }
#side .top .note { margin-top: 4px; }
#list { overflow-y: auto; flex: 1; padding: 4px 0 20px; }
.grp { padding: 10px 10px 3px; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.snd { display: flex; align-items: center; gap: 8px; padding: 2px 10px 2px 10px; cursor: pointer; }
.snd:hover { background: var(--raise); }
.snd.on { background: var(--sel); color: var(--bright); }
.snd .p { padding: 0 6px; font-size: 11px; }
.snd .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snd .d { color: var(--accent); }

/* The open sound. */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#head { padding: 10px 16px 8px; border-bottom: 1px solid var(--line); }
#head h1 { margin: 0; font-size: 18px; color: var(--bright); font-weight: normal; display: flex; gap: 12px; align-items: baseline; }
#head h1 .g { color: var(--dim); font-size: 12px; }
#head .doc { margin-top: 3px; white-space: pre-wrap; }
#tools { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); }
#tools .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
#tools kbd { color: var(--dim); font-size: 10px; margin-left: 3px; }
#body { flex: 1; overflow-y: auto; padding: 12px 16px 30px; min-height: 0; }
#wave { width: 100%; height: 90px; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
#waveinfo { color: var(--dim); font-size: 11px; margin: 3px 0 12px; }
#status { padding: 5px 16px; border-top: 1px solid var(--line); color: var(--dim); min-height: 28px; white-space: pre-wrap; }
#status.bad { color: var(--bad); }
#status.good { color: var(--good); }

.card { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); margin-bottom: 10px; }
.card.muted { opacity: .45; }
.card .bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.card .bar .t { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; flex: 1; }
.card .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 2px 18px; padding: 6px 8px; }
.row { display: grid; grid-template-columns: 70px 1fr 74px; gap: 8px; align-items: center; }
.row label { color: var(--dim); }
.row.set label { color: var(--bright); }
.row input[type=range] { width: 100%; padding: 0; accent-color: var(--accent); background: none; border: none; }
.row input[type=number] { width: 100%; padding: 2px 4px; }
.note { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div class="top">
      <h2>Sounds</h2>
      <div class="note">▶ plays. ↑ ↓ move through them.</div>
    </div>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="head"><h1><span id="name"></span><span class="g" id="group"></span></h1><div class="doc" id="doc"></div></div>
    <div id="tools">
      <button id="play" title="Play it as heard close by">PLAY<kbd>space</kbd></button>
      <button id="wall" title="Through one wall: dulled and quieter">THROUGH A WALL</button>
      <button id="far" title="Half its reach away">FAR OFF</button>
      <button id="asleep" title="As a sleeper hears it">ASLEEP</button>
      <span class="sep"></span>
      <button id="save">SAVE<kbd>ctrl+s</kbd></button>
      <button id="revert">REVERT</button>
      <span class="sep"></span>
      <button id="add">+ LAYER</button>
    </div>
    <div id="body">
      <canvas id="wave"></canvas>
      <div id="waveinfo"></div>
      <div id="sound"></div>
      <div id="layers"></div>
    </div>
    <div id="status"></div>
  </div>
</div>
<script>
"use strict";

// How the game changes a sound as it is heard (src/audio/hearing.cpp and
// audio.cpp): a wall keeps WALL_KEEP of it, dulled under MUFFLE_HZ; half
// its reach away it is (1 - 1/2)^2 as loud; asleep it hears ASLEEP_KEEP,
// or ASLEEP_URGENT_KEEP of the sounds that always play.
const WALL_KEEP = 0.45, MUFFLE_HZ = 450, FAR_KEEP = 0.25, ASLEEP_KEEP = 0.08, ASLEEP_URGENT_KEEP = 0.3;
const URGENT = new Set(["cry", "slam", "spikes", "death"]);
const HEARD = {
  play: {lowpass: 0, keep: () => 1, label: "close by"},
  wall: {lowpass: MUFFLE_HZ, keep: () => WALL_KEEP, label: "through a wall"},
  far: {lowpass: 0, keep: () => FAR_KEEP, label: "far off"},
  asleep: {lowpass: 0, keep: n => URGENT.has(n) ? ASLEEP_URGENT_KEEP : ASLEEP_KEEP, label: "asleep"},
};

// Each slider: its range, and whether it moves in pitch (log) or evenly.
// off: the far left is 0, meaning none.
const HZ = {min: 20, max: 12000, log: true};
const RANGES = {
  from: HZ, to: HZ,
  gain: {min: 0, max: 1, step: 0.01}, delay: {min: 0, max: 1, step: 0.005},
  attack: {min: 0, max: 0.5, step: 0.001}, hold: {min: 0, max: 1, step: 0.005}, decay: {min: 0, max: 2, step: 0.005},
  lowpass: {min: 50, max: 12000, log: true, off: true}, highpass: {min: 50, max: 12000, log: true, off: true},
  duty: {min: 0.05, max: 0.95, step: 0.01}, repeat: {min: 1, max: 8, step: 1}, gap: {min: 0, max: 0.5, step: 0.005},
  fade: {min: 0, max: 1.5, step: 0.01}, wobble: {min: 0, max: 1, step: 0.01},
  soundGain: {min: 0, max: 2, step: 0.01}, bits: {min: 1, max: 16, step: 1}, rate: {min: 500, max: 22050, log: true},
};
const TIPS = {
  from: "Hz at the start", to: "Hz at the end, slid to evenly in pitch", gain: "how loud, 0 to 1",
  delay: "seconds before it starts", attack: "seconds rising", hold: "seconds held", decay: "seconds falling away",
  lowpass: "keep only what is under this Hz (far left: none)", highpass: "keep only what is over this Hz (far left: none)",
  duty: "a square's share high", repeat: "played this many times", gap: "seconds between repeats",
  fade: "each repeat this times as loud as the last", wobble: "pitch wandering at random: crunch",
  soundGain: "the whole sound's loudness", bits: "the crush: bits a sample", rate: "the crush: samples a second",
};
const STEPS = 1000;

let sounds = [], byName = {}, layerKeys = {}, waves = [], version = "", open = null;
let ctx = null, playing = null;
const $ = id => document.getElementById(id);

function fmt(v) { return String(parseFloat(Number(v).toPrecision(4))); }
const clone = o => JSON.parse(JSON.stringify(o));

// A sound as the file has it, from its parts: what the file spelt out and
// what was moved here, nothing else.
function blockOf(s, skipMuted) {
  let head = "sound " + s.name;
  const o = s.edit.options;
  for (const k of ["gain", "bits", "rate"]) if (o[k] !== undefined) head += ` ${k} ${fmt(o[k])}`;
  const lines = [head];
  for (const l of s.edit.layers) {
    if (skipMuted && l.muted) continue;
    let line = "    " + l.wave + " " + fmt(l.from);
    if (l.to !== undefined && +l.to !== +l.from) line += " " + fmt(l.to);
    for (const k of Object.keys(layerKeys))
      if (l.keys[k] !== undefined) line += " " + k + " " + fmt(l.keys[k]);
    lines.push(line);
  }
  return lines.join("\n");
}
const dirty = s => blockOf(s) !== blockOf({...s, edit: s.saved});

function status(text, kind) {
  $("status").textContent = text || "";
  $("status").className = kind || "";
}

async function load() {
  const r = await fetch("/api/sounds");
  const sheet = await r.json();
  layerKeys = sheet.layerKeys, waves = sheet.waves, version = sheet.version;
  const old = byName;
  sounds = sheet.sounds, byName = {};
  for (const s of sounds) {
    const saved = {options: s.options, layers: s.layers};
    const was = old[s.name];
    s.saved = saved;
    // Edits not yet saved stay, and still answer to the block they began from.
    if (was && dirty(was)) s.edit = was.edit, s.seen = was.seen;
    else s.edit = clone(saved), s.seen = s.block;
    byName[s.name] = s;
  }
  if (!sheet.renderer) status("build/sound_sheet is missing: start the editor with ./sounds.sh, which builds it", "bad");
  drawList();
  show(open && byName[open] ? open : sounds[0].name);
}

function drawList() {
  const list = $("list");
  list.innerHTML = "";
  let group = null;
  for (const s of sounds) {
    if (s.section !== group) {
      group = s.section;
      const g = document.createElement("div");
      g.className = "grp", g.textContent = group || "sounds";
      list.appendChild(g);
    }
    const row = document.createElement("div");
    row.className = "snd" + (s.name === open ? " on" : "");
    const p = document.createElement("button");
    p.className = "p", p.textContent = "▶", p.title = "Play";
    p.onclick = e => { e.stopPropagation(); play(s, "play"); };
    const n = document.createElement("span");
    n.className = "n", n.textContent = s.name;
    const d = document.createElement("span");
    d.className = "d", d.textContent = dirty(s) ? "●" : "", d.title = "changed, not saved";
    row.append(p, n, d);
    row.onclick = () => { show(s.name); play(s, "play"); };
    list.appendChild(row);
  }
}

function show(name) {
  open = name;
  const s = byName[name];
  $("name").textContent = s.name;
  $("group").textContent = s.section;
  $("doc").textContent = s.notes.join("\n");
  for (const row of document.querySelectorAll(".snd"))
    row.classList.toggle("on", row.querySelector(".n").textContent === name);
  drawSound();
  drawLayers();
  marks();
}

// Marks what isn't saved, in the list and on SAVE and REVERT.
function marks() {
  const s = byName[open], d = dirty(s);
  $("save").disabled = $("revert").disabled = !d;
  for (const row of document.querySelectorAll(".snd")) {
    const t = byName[row.querySelector(".n").textContent];
    row.querySelector(".d").textContent = dirty(t) ? "●" : "";
  }
}

// One slider with its number. get and set read and write the value;
// changed runs as it is let go.
function slider(key, label, get, set, isDefault) {
  const r = RANGES[key], row = document.createElement("div");
  row.className = "row" + (isDefault() ? "" : " set");
  row.title = TIPS[key] || "";
  const lab = document.createElement("label");
  lab.textContent = label;
  const range = document.createElement("input");
  range.type = "range", range.min = 0, range.max = STEPS;
  const num = document.createElement("input");
  num.type = "number", num.step = "any", num.min = r.off ? 0 : r.min;
  const toPos = v => {
    if (r.off && v <= 0) return 0;
    v = Math.min(Math.max(v, r.min), r.max);
    return Math.round(r.log ? Math.log(v / r.min) / Math.log(r.max / r.min) * STEPS : (v - r.min) / (r.max - r.min) * STEPS);
  };
  const fromPos = p => {
    if (r.off && p <= 0) return 0;
    let v = r.log ? r.min * Math.pow(r.max / r.min, p / STEPS) : r.min + (r.max - r.min) * p / STEPS;
    if (r.log) v = parseFloat(v.toPrecision(v < 100 ? 2 : 3));
    else v = Math.round(v / r.step) * r.step;
    return parseFloat(v.toPrecision(4));
  };
  const sync = () => { range.value = toPos(get()); num.value = fmt(get()); row.classList.toggle("set", !isDefault()); };
  range.oninput = () => { set(fromPos(+range.value)); num.value = fmt(get()); row.classList.toggle("set", !isDefault()); };
  // A new repeat count shows or hides gap and fade.
  const after = () => { if (key === "repeat") drawLayers(); marks(); play(byName[open], "play"); };
  range.onchange = after;
  num.onchange = () => {
    if (num.value === "" || isNaN(+num.value)) return sync();
    set(+num.value);
    sync();
    after();
  };
  sync();
  row.append(lab, range, num);
  return row;
}

function drawSound() {
  const s = byName[open], o = s.edit.options, box = $("sound");
  box.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card";
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.innerHTML = '<span class="t">the whole sound</span>';
  const rows = document.createElement("div");
  rows.className = "rows";
  rows.append(
    slider("soundGain", "gain", () => o.gain ?? 1, v => o.gain = v, () => (o.gain ?? 1) === 1),
    slider("bits", "bits", () => o.bits ?? s.crush.bits, v => o.bits = Math.round(v), () => (o.bits ?? s.crush.bits) === s.crush.bits),
    slider("rate", "rate", () => o.rate ?? s.crush.rate, v => o.rate = v, () => (o.rate ?? s.crush.rate) === s.crush.rate));
  card.append(bar, rows);
  box.appendChild(card);
}

function drawLayers() {
  const s = byName[open], box = $("layers");
  box.innerHTML = "";
  s.edit.layers.forEach((l, i) => {
    const card = document.createElement("div");
    card.className = "card" + (l.muted ? " muted" : "");
    const bar = document.createElement("div");
    bar.className = "bar";
    const t = document.createElement("span");
    t.className = "t", t.textContent = "layer " + (i + 1);
    const wave = document.createElement("select");
    for (const w of waves) wave.add(new Option(w, w, false, w === l.wave));
    // Only a square has a duty.
    wave.onchange = () => { l.wave = wave.value; drawLayers(); marks(); play(s, "play"); };
    const button = (text, title, act) => {
      const b = document.createElement("button");
      b.textContent = text, b.title = title, b.onclick = act;
      return b;
    };
    const mute = button("MUTE", "Leave it out while listening; it is still saved", () => {
      l.muted = !l.muted; drawLayers(); play(s, "play");
    });
    mute.classList.toggle("on", !!l.muted);
    const solo = button("SOLO", "Hear only this layer", () => {
      const only = !s.edit.layers.every((m, j) => (j === i) !== !!m.muted);
      s.edit.layers.forEach((m, j) => m.muted = only && j !== i);
      drawLayers(); play(s, "play");
    });
    const copy = button("COPY", "Add a copy of this layer under it", () => {
      const c = clone(l);
      delete c.muted;
      s.edit.layers.splice(i + 1, 0, c);
      drawLayers(); marks(); play(s, "play");
    });
    const remove = button("REMOVE", "Take this layer out", () => {
      if (s.edit.layers.length === 1) return status("A sound needs a layer.", "bad");
      s.edit.layers.splice(i, 1);
      drawLayers(); marks(); play(s, "play");
    });
    bar.append(t, wave, mute, solo, copy, remove);
    const rows = document.createElement("div");
    rows.className = "rows";
    rows.append(
      slider("from", "from Hz", () => l.from, v => l.from = Math.max(v, 1), () => false),
      slider("to", "to Hz", () => l.to ?? l.from, v => l.to = Math.max(v, 1), () => (l.to ?? l.from) === l.from));
    for (const k of Object.keys(layerKeys)) {
      if (k === "duty" && l.wave !== "square") continue;
      if ((k === "gap" || k === "fade") && (l.keys.repeat ?? 1) <= 1) continue;
      rows.appendChild(slider(k, k, () => l.keys[k] ?? layerKeys[k],
        v => l.keys[k] = k === "repeat" ? Math.max(1, Math.round(v)) : v,
        () => (l.keys[k] ?? layerKeys[k]) === layerKeys[k]));
    }
    card.append(bar, rows);
    box.appendChild(card);
  });
}

async function play(s, how) {
  const heard = HEARD[how];
  const block = blockOf(s, true);
  if (block.split("\n").length < 2) return status("Every layer is muted.", "bad");
  ctx = ctx || new AudioContext();
  let r;
  try {
    r = await fetch("/api/render", {method: "POST", body: JSON.stringify({block, crush: s.crush, lowpass: heard.lowpass})});
  } catch (e) {
    return status("The editor isn't running: start it with ./sounds.sh", "bad");
  }
  if (!r.ok) return status((await r.json()).error, "bad");
  const buffer = await ctx.decodeAudioData(await r.arrayBuffer());
  if (playing) try { playing.stop(); } catch (e) {}
  const src = ctx.createBufferSource(), gain = ctx.createGain();
  gain.gain.value = heard.keep(s.name);
  src.buffer = buffer;
  src.connect(gain).connect(ctx.destination);
  src.start();
  playing = src;
  if (s.name === open)
    drawWave(buffer, heard.keep(s.name), heard.label, +r.headers.get("X-Peak"), +r.headers.get("X-Clipped"));
  if ($("status").className === "bad") status("");
}

// The wave as played, and its true peak and clipped samples from the
// server (the browser's resampled copy overshoots).
function drawWave(buffer, keep, label, peak, clipped) {
  const c = $("wave"), w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1;
  c.width = w * dpr, c.height = h * dpr;
  const g = c.getContext("2d");
  g.scale(dpr, dpr);
  g.strokeStyle = "#333";
  g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
  const data = buffer.getChannelData(0), per = data.length / w;
  g.fillStyle = "#e0c060";
  for (let x = 0; x < w; x++) {
    let lo = 0, hi = 0;
    for (let i = Math.floor(x * per); i < Math.floor((x + 1) * per); i++) lo = Math.min(lo, data[i]), hi = Math.max(hi, data[i]);
    hi = Math.min(hi, 1), lo = Math.max(lo, -1);
    g.fillRect(x, h / 2 - hi * keep * h / 2, 1, Math.max(1, (hi - lo) * keep * h / 2));
  }
  $("waveinfo").textContent = `${label}: ${buffer.duration.toFixed(2)} s, peak ${(peak * keep).toFixed(2)}` +
    (clipped ? `, ${clipped} samples cut off at full loudness (crunch, or turn the gain down)` : "");
}

async function save() {
  const s = byName[open];
  if (!dirty(s)) return;
  const r = await fetch("/api/save", {method: "POST", body: JSON.stringify({name: s.name, old: s.seen, block: blockOf(s)})});
  const body = await r.json();
  if (!r.ok) {
    // Someone else changed it: SAVE again keeps these edits over theirs.
    const now = byName[s.name];
    const fresh = await (await fetch("/api/sounds")).json();
    const theirs = fresh.sounds.find(t => t.name === s.name);
    if (theirs) now.seen = theirs.block;
    return status(body.error + (theirs ? "\nSAVE again to keep yours over it, or REVERT to take the file's." : ""), "bad");
  }
  const edits = {};
  for (const t of sounds) if (t.name !== s.name && dirty(t)) edits[t.name] = t;
  byName = edits;
  version = body.version;
  await load();
  status(`Saved ${s.name}. F5 in the game hears it.`, "good");
}

function revert() {
  const s = byName[open];
  s.edit = clone(s.saved);
  s.seen = s.block;
  show(open);
  play(s, "play");
}

$("play").onclick = () => play(byName[open], "play");
$("wall").onclick = () => play(byName[open], "wall");
$("far").onclick = () => play(byName[open], "far");
$("asleep").onclick = () => play(byName[open], "asleep");
$("save").onclick = save;
$("revert").onclick = revert;
$("add").onclick = () => {
  const s = byName[open];
  s.edit.layers.push({wave: "square", from: 440, keys: {}});
  drawLayers(); marks(); play(s, "play");
  $("body").scrollTop = $("body").scrollHeight;
};

document.addEventListener("keydown", e => {
  const typing = e.target.tagName === "INPUT" && e.target.type !== "range" || e.target.tagName === "SELECT";
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); return; }
  if (typing) return;
  if (e.key === " ") { e.preventDefault(); play(byName[open], "play"); return; }
  if ((e.key === "ArrowUp" || e.key === "ArrowDown") && e.target.type !== "range") {
    e.preventDefault();
    const i = sounds.findIndex(s => s.name === open) + (e.key === "ArrowUp" ? -1 : 1);
    if (i >= 0 && i < sounds.length) { show(sounds[i].name); play(sounds[i], "play"); }
  }
});

window.addEventListener("beforeunload", e => { if (sounds.some(dirty)) e.preventDefault(); });

// The file changed (a hand edit, another session): take the new copy of
// every sound not being edited here.
setInterval(async () => {
  try {
    const v = (await (await fetch("/api/version")).json()).version;
    if (v !== version) await load();
  } catch (e) {}
}, 2000);

load();
</script>
</body>
</html>
