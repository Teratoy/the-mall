<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lines Editor</title>
<style>
:root {
  --bg: #181818; --panel: #202020; --raise: #2a2a2a; --line: #333; --ink: #b9b9b9; --bright: #f0f0f0;
  --dim: #787878; --sel: #34404c; --accent: #e0c060; --bad: #e1463c; --good: #78c878;
  --plain: #969696; --warm: #78c878; --rude: #d77850; --plead: #82a5dc; --fear: #af8cd7; --threat: #e1463c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 13px/1.4 ui-monospace, "DejaVu Sans Mono", Menlo, monospace; }
button, input, select { font: inherit; color: var(--bright); background: var(--raise); border: 1px solid var(--line);
  border-radius: 3px; padding: 3px 7px; }
button { cursor: pointer; }
button:hover { border-color: var(--dim); }
button.primary { border-color: var(--accent); color: var(--accent); }
input:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); }
#app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
#side .top { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 7px; }
#search { width: 100%; }
.stats { color: var(--dim); }
.stats b { color: var(--bright); font-weight: normal; }
.bar { height: 4px; background: var(--raise); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
label.tog { display: inline-flex; gap: 5px; align-items: center; margin-right: 10px; cursor: pointer; }
#list { overflow-y: auto; flex: 1; padding: 4px 0 20px; }
.grp { padding: 10px 10px 3px; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.mom { display: flex; justify-content: space-between; gap: 6px; padding: 2px 10px 2px 16px; cursor: pointer; }
.mom:hover { background: var(--raise); }
.mom.on { background: var(--sel); color: var(--bright); }
.mom .n { color: var(--dim); font-size: 11px; white-space: nowrap; }
.mom .n .u { color: var(--accent); }
.mom .n .d { color: var(--plead); }
.warnbox { margin: 8px 10px; padding: 6px 8px; border: 1px solid var(--bad); color: var(--bad); border-radius: 3px; }
#main { overflow-y: auto; min-height: 0; }
#head { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 18px 10px; }
#head h1 { margin: 0; font-size: 18px; color: var(--bright); font-weight: normal; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
#head h1 .g { color: var(--dim); font-size: 12px; }
#head .doc { color: var(--ink); margin-top: 4px; white-space: pre-wrap; }
#head .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
#head .chance { width: 64px; }
details.gdoc { margin-top: 6px; color: var(--dim); }
details.gdoc pre { white-space: pre-wrap; margin: 4px 0 0; font: inherit; }
#lines { padding: 8px 18px 120px; }
.mhead { margin: 18px 0 4px; color: var(--accent); cursor: pointer; }
.item { scroll-margin-top: 150px; scroll-margin-bottom: 20px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 7px 8px;
  border: 1px solid transparent; border-radius: 4px; }
.item.on { border-color: var(--accent); background: #222; }
.item.rev .words { color: var(--dim); }
.item canvas { image-rendering: pixelated; display: block; }
.words { color: var(--bright); font-size: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 3px; }
.chip { font-size: 11px; padding: 0 5px; border-radius: 3px; background: var(--raise); color: var(--ink); }
.chip.neg { color: var(--rude); }
.chip.tone { border: 1px solid; background: none; }
.chip.bad { background: var(--bad); color: #fff; }
.flag { font-size: 11px; color: var(--accent); }
.flag.bad { color: var(--bad); }
.tick { font-size: 11px; color: var(--good); }
.draft { margin-top: 7px; padding: 7px 9px; border-left: 3px solid var(--plead); background: #1d2430; border-radius: 0 4px 4px 0;
  display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.draft .note { color: var(--dim); font-style: italic; }
.draft .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.draft .acts button { white-space: nowrap; }
.lineacts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.editor { grid-column: 1 / -1; display: grid; gap: 7px; padding: 8px; background: var(--panel); border-radius: 4px; }
.editor .fields { display: grid; grid-template-columns: 70px 1fr; gap: 6px; align-items: center; }
.editor input.w { font-size: 14px; text-transform: uppercase; }
.tones { display: flex; gap: 4px; flex-wrap: wrap; }
.tones button.on { color: #111; }
.sugg { display: flex; gap: 4px; flex-wrap: wrap; min-height: 18px; }
.sugg span { cursor: pointer; }
.sugg span.hi { outline: 1px solid var(--accent); }
.empty { color: var(--dim); padding: 30px 0; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff;
  padding: 7px 14px; border-radius: 4px; display: none; z-index: 9; }
#toast.ok { background: #2c5a2c; }
#help { position: fixed; inset: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 18px 22px; overflow: auto; display: none; z-index: 8; }
.why { margin: 5px 0 0; padding: 0; list-style: none; color: var(--ink); font-size: 12px; }
.why li { margin: 1px 0; }
.why b { color: var(--bright); font-weight: normal; display: inline-block; min-width: 110px; }
.why b.neg { color: var(--rude); }
.why .plain { color: var(--dim); }
#edSuggWhy { color: var(--dim); font-size: 12px; min-height: 16px; }
.ref input { width: 100%; margin: 4px 0 12px; }
.ref h3 { color: var(--accent); font-weight: normal; font-size: 12px; text-transform: uppercase; margin: 14px 0 4px; }
.ref .r { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 2px 4px; border-radius: 3px; }
.ref .r b { color: var(--bright); font-weight: normal; }
.ref.picking .r { cursor: pointer; }
.ref.picking .r:hover { background: var(--sel); }
#help pre { white-space: pre-wrap; font: inherit; color: var(--ink); }
#help h2 { color: var(--bright); font-weight: normal; font-size: 15px; margin: 0 0 8px; }
kbd { background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--bright); }
.keys { display: grid; grid-template-columns: 110px 1fr; gap: 3px 10px; margin-bottom: 16px; }
@media (max-width: 720px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
  #side { border-right: 0; border-bottom: 1px solid var(--line); }
  .item { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="top">
      <input id="search" placeholder="Search words, conditions, moments  ( / )" autocomplete="off">
      <div>
        <label class="tog"><input type="checkbox" id="fUnrev"> unreviewed</label>
        <label class="tog"><input type="checkbox" id="fDrafts"> drafts</label>
        <label class="tog" title="Show what each line's conditions mean under every line, not only the selected one"><input type="checkbox" id="fExplain"> meanings</label>
      </div>
      <div class="stats" id="stats"></div>
      <div class="bar"><i id="progress"></i></div>
      <div><button id="helpBtn">? Help and keys</button> <button id="refBtn">Conditions (c)</button></div>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="head"></div>
    <div id="lines"></div>
  </main>
</div>
<div id="toast"></div>
<div id="help"></div>
<script>
"use strict";
// ---- The game's bubble, measured and drawn as src/render/speech_view.cpp does ----
const TEXT_W = 96, PAD_X = 3, PAD_Y = 2, ROW = 11, SPACING = 1, SCALE = 2;
const TONE_RGB = { "": [150,150,150], plain: [150,150,150], warm: [120,200,120], rude: [215,120,80],
  plead: [130,165,220], fear: [175,140,215], threat: [225,70,60] };
// Stand-ins for the names a line is filled with, about as long as grown names.
const FILL = { "{NAME}": "HALVOR", "{ME}": "MIRA", "{WHO}": "BENTE", "{THING}": "BRONZE MUG", "{N}": "3" };
let font = null, ink = null;

async function loadFont() {
  const [json, img] = await Promise.all([
    fetch("font.json").then(r => r.json()),
    new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = "font.png"; }),
  ]);
  // The game draws bubble words in ui::BRIGHT.
  ink = document.createElement("canvas");
  ink.width = img.width; ink.height = img.height;
  const g = ink.getContext("2d");
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = "source-in";
  g.fillStyle = "rgb(240,240,240)";
  g.fillRect(0, 0, ink.width, ink.height);
  font = json.glyphs;
}
function glyph(ch) { return font[ch.codePointAt(0)] || font[63]; }
function measure(s) {
  if (!s.length) return 0;
  let w = 0;
  for (const ch of s) { const g = glyph(ch); w += g[6] ? g[6] : g[2] + g[4]; }
  return w + (s.length - 1) * SPACING;
}
function wrap(s, width) {
  const out = []; let line = "";
  for (const word of s.split(" ")) {
    const tried = line === "" ? word : line + " " + word;
    if (line !== "" && measure(tried) > width) { out.push(line); line = word; } else line = tried;
  }
  if (line !== "") out.push(line);
  return out;
}
function filled(text) {
  let t = text.toUpperCase();
  for (const k in FILL) t = t.split(k).join(FILL[k]);
  return t;
}
function bubbleRows(text) { return wrap(filled(text), TEXT_W); }
function drawBubble(text, tone) {
  const rows = bubbleRows(text);
  const w = Math.max(0, ...rows.map(measure));
  const bw = w + 2 * PAD_X, bh = rows.length * ROW + 2 * PAD_Y - 1;
  const cw = TEXT_W + 2 * PAD_X + 6, ch = bh + 10;
  const c = document.createElement("canvas");
  c.width = cw * SCALE; c.height = ch * SCALE;
  c.style.width = cw * SCALE + "px"; c.style.height = ch * SCALE + "px";
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.scale(SCALE, SCALE);
  g.fillStyle = "rgb(68,68,68)";            // ui::GROUND, the floor
  g.fillRect(0, 0, cw, ch);
  const x = Math.round((cw - bw) / 2), y = 3;
  const edge = "rgb(" + (TONE_RGB[tone] || TONE_RGB[""]).join(",") + ")";
  const tx = Math.floor(x + bw / 2);
  g.fillStyle = edge;
  g.fillRect(tx, y + bh, 1, ch - y - bh - 1); // the tail down to the speaker's head
  g.fillStyle = "rgba(14,14,14,0.882)";
  g.fillRect(x, y, bw, bh);
  g.fillStyle = edge;
  g.fillRect(x, y, bw, 1); g.fillRect(x, y + bh - 1, bw, 1);
  g.fillRect(x, y, 1, bh); g.fillRect(x + bw - 1, y, 1, bh);
  const cx = Math.trunc(x + bw / 2);
  let ry = y + PAD_Y;
  for (const r of rows) {
    let px = cx - Math.trunc(measure(r) / 2);
    for (const chr of r) {
      const gl = glyph(chr);
      if (chr !== " ") g.drawImage(ink, gl[0], gl[1], gl[2], gl[3], px + gl[4], ry + gl[5], gl[2], gl[3]);
      px += (gl[6] ? gl[6] : gl[2]) + SPACING;
    }
    ry += ROW;
  }
  c.title = rows.length + (rows.length === 1 ? " row" : " rows");
  return c;
}

// ---- State ----
let book = null, version = "";
let current = null;          // the moment shown
let sel = 0;                 // the selected item among those shown
let editing = null;          // {kind: "edit"|"add"|"accept", item, conds, tone, text}
let items = [];              // what the main view lists, in order
const filt = { search: "", unrev: false, drafts: false, explain: false };
const $ = id => document.getElementById(id);
try { Object.assign(filt, JSON.parse(localStorage.getItem("linesFilt") || "{}")); current = localStorage.getItem("linesMoment"); } catch (e) {}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function toast(msg, ok) {
  const t = $("toast"); t.textContent = msg; t.className = ok ? "ok" : ""; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", ok ? 1500 : 4000);
}
function reviewed(line) { return !!book.review[line.key]; }
function moment(name) { return book.moments.find(m => m.name === name); }
function draftsFor(m) { return book.drafts.filter(d => d.moment === m.name); }
function draftOf(m, line) { return book.drafts.find(d => d.moment === m.name && d.old && d.old.toUpperCase().trim() === line.text.toUpperCase()); }
function unrevCount(m) { return m.lines.filter(l => !reviewed(l)).length; }
function matches(m, line, q) {
  return line.text.toLowerCase().includes(q) || line.conds.join(" ").includes(q) || line.tone === q || m.name.includes(q);
}
function visibleMoments() {
  return book.moments.filter(m => (!filt.unrev || unrevCount(m) > 0) && (!filt.drafts || draftsFor(m).length > 0)
    && (!filt.search || m.lines.some(l => matches(m, l, filt.search.toLowerCase())) || m.name.includes(filt.search.toLowerCase())));
}
function problems(line) {
  const out = [];
  for (const c of line.conds) if (!book.conds.includes(c.replace(/^!/, ""))) out.push("no condition " + c);
  for (const s of line.text.match(/\{[^}]*\}?/g) || []) if (!(s in FILL)) out.push("no name " + s);
  if (line.text.trim() === "") out.push("no words");
  return out;
}

// ---- Loading and saving ----
async function load() {
  const r = await fetch("api/book");
  take(await r.json());
}
function take(b) {
  const keep = items[sel] ? itemId(items[sel]) : null;
  book = b; version = b.version;
  meaning = {};
  for (const g of book.meanings) for (const [n, t] of g.items) meaning[n] = t;
  if (!current || !moment(current)) current = (visibleMoments()[0] || book.moments[0]).name;
  render();
  if (keep) { const i = items.findIndex(it => itemId(it) === keep); if (i >= 0) sel = i; }
  render();
}
function itemId(it) { return it.line ? it.m.name + "|" + it.line.raw : it.draft ? "draft|" + it.draft.id : "adding"; }
async function op(body) {
  const r = await fetch("api/op", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) { toast(data.error); await load(); return false; }
  take(data);
  return true;
}
async function poll() {
  try {
    const r = await fetch("api/version");
    const v = (await r.json()).version;
    if (v !== version) {
      if (editing) { $("toast").textContent = ""; toast("The file changed on disk: it reloads when you finish editing.", true); }
      else { await load(); toast("Reloaded: the file changed on disk.", true); }
    }
  } catch (e) {}
  setTimeout(poll, 2000);
}

// ---- Drawing the page ----
function render() {
  saveFilt();
  renderSide();
  renderMain();
}
function saveFilt() {
  try { localStorage.setItem("linesFilt", JSON.stringify(filt)); localStorage.setItem("linesMoment", current || ""); } catch (e) {}
}
function renderSide() {
  const total = book.moments.reduce((n, m) => n + m.lines.length, 0);
  const done = book.moments.reduce((n, m) => n + m.lines.filter(reviewed).length, 0);
  $("stats").innerHTML = `<b>${done}</b> of <b>${total}</b> lines reviewed · <b>${book.drafts.length}</b> drafts · ${book.moments.length} moments`;
  $("progress").style.width = (total ? 100 * done / total : 0) + "%";
  let html = "";
  if (book.missing.length) html += `<div class="warnbox">In the game but not in the file (they say nothing): ${book.missing.map(esc).join(", ")}</div>`;
  if (book.unknown.length) html += `<div class="warnbox">In the file but not in the game (never said): ${book.unknown.map(esc).join(", ")}</div>`;
  const undescribed = book.conds.concat(book.tones).filter(c => !meaning[c]);
  if (undescribed.length) html += `<div class="warnbox">Conditions with no description yet (tools/lines_editor/conditions.txt): ${undescribed.map(esc).join(", ")}</div>`;
  let group = null;
  const vis = visibleMoments();
  for (const m of vis) {
    if (m.group !== group) { group = m.group; html += `<div class="grp">${esc(group)}</div>`; }
    const u = unrevCount(m), d = draftsFor(m).length;
    html += `<div class="mom${m.name === current && !filt.search ? " on" : ""}" data-m="${esc(m.name)}"><span>${esc(m.name)}</span>
      <span class="n">${d ? `<span class="d">${d}✎</span> ` : ""}${u ? `<span class="u">${u}</span>/` : ""}${m.lines.length}</span></div>`;
  }
  if (!vis.length) html += `<div class="empty" style="padding:20px">Nothing matches.</div>`;
  $("list").innerHTML = html;
  const on = $("list").querySelector(".mom.on");
  if (on) on.scrollIntoView({ block: "nearest" });
}
let meaning = {};
/// What a condition or tone means in plain words; "!" turns it round.
function meaningOf(c) {
  const neg = c.startsWith("!"), name = c.replace(/^!/, ""), m = meaning[name];
  if (!book.conds.includes(name) && !book.tones.includes(name)) return "Not a condition the game knows: check the spelling.";
  if (!m) return "No description yet: add one to tools/lines_editor/conditions.txt.";
  return neg ? "Not so: " + m.charAt(0).toLowerCase() + m.slice(1) : m;
}
/// The line's conditions and tone read out, one per row.
function explain(conds, tone) {
  let h = `<ul class="why">`;
  if (!conds.length) h += `<li class="plain">No conditions: anyone may say it whenever this moment comes. Lines with conditions that hold are picked first.</li>`;
  else h += `<li class="plain">Said only when all of these hold:</li>`;
  for (const c of conds) h += `<li><b class="${c.startsWith("!") ? "neg" : ""}">${esc(c)}</b>${esc(meaningOf(c))}</li>`;
  if (tone) h += `<li class="plain">Its tone:</li><li><b style="color:rgb(${TONE_RGB[tone]})">${esc(tone)}</b>${esc(meaningOf(tone))}</li>`;
  return h + `</ul>`;
}
function chips(conds, tone) {
  let h = conds.map(c => `<span title="${esc(meaningOf(c))}" class="chip${c.startsWith("!") ? " neg" : ""}${book.conds.includes(c.replace(/^!/, "")) ? "" : " bad"}">${esc(c)}</span>`).join("");
  if (tone) h += `<span title="${esc(meaningOf(tone))}" class="chip tone" style="color:rgb(${TONE_RGB[tone]});border-color:rgb(${TONE_RGB[tone]})">${esc(tone)}</span>`;
  return h;
}
function draftWords(d) { return d.conds === undefined ? null : d.conds.split(/\s+/).filter(Boolean); }
function splitWords(words) {
  return { conds: words.filter(w => !book.tones.includes(w)), tone: words.find(w => book.tones.includes(w)) || "" };
}
function renderMain() {
  items = [];
  const searching = !!filt.search;
  const shown = searching ? visibleMoments() : [moment(current)].filter(Boolean);
  const m0 = shown[0];
  if (!searching && m0) {
    const gdoc = book.groups[m0.group];
    $("head").innerHTML = `<h1>[${esc(m0.name)}] <span class="g">${esc(m0.group)}</span></h1>
      <div class="doc">${esc(m0.doc.join("\n")) || "<i>No comment above this moment.</i>"}</div>
      <div class="row">chance <input class="chance" id="chance" placeholder="always" value="${m0.chance ?? ""}">
        <button id="addBtn">+ Add line (a)</button><button id="revAll">Mark all reviewed (R)</button>
        <span class="stats">${m0.lines.length} lines, ${unrevCount(m0)} unreviewed</span></div>
      ${gdoc && gdoc.join("").trim() ? `<details class="gdoc"><summary>About "${esc(m0.group)}"</summary><pre>${esc(gdoc.join("\n").trim())}</pre></details>` : ""}`;
  } else {
    $("head").innerHTML = `<h1>Search: “${esc(filt.search)}”</h1><div class="doc">${shown.length} moments. Esc clears.</div>`;
  }
  const q = filt.search.toLowerCase();
  for (const m of shown) {
    for (const line of m.lines) if (!searching || matches(m, line, q)) items.push({ m, line, draft: draftOf(m, line) });
    for (const d of draftsFor(m)) if (!d.old || !d.found) items.push({ m, draft: d });
    if (editing && editing.kind === "add" && editing.m === m) items.push({ m, adding: true });
  }
  if (sel >= items.length) sel = Math.max(0, items.length - 1);
  const box = $("lines");
  box.innerHTML = "";
  let lastM = null;
  items.forEach((it, i) => {
    if (searching && it.m !== lastM) {
      lastM = it.m;
      const h = document.createElement("div"); h.className = "mhead"; h.textContent = "[" + it.m.name + "]  " + it.m.group;
      h.onclick = () => showMoment(it.m.name);
      box.appendChild(h);
    }
    box.appendChild(renderItem(it, i));
  });
  if (!items.length) box.innerHTML = `<div class="empty">No lines here yet. Press <kbd>a</kbd> to add one.</div>`;
  const on = box.querySelector(".item.on");
  if (on) on.scrollIntoView({ block: "nearest" });
  wireHead();
}
function renderItem(it, i) {
  const el = document.createElement("div");
  el.className = "item" + (i === sel ? " on" : "");
  el.onclick = e => {
    if (el.contains(document.activeElement)) return;
    // Out of the search or chance box, so the keys work on the line again.
    if (document.activeElement && document.activeElement.tagName === "INPUT") document.activeElement.blur();
    if (sel !== i) { sel = i; if (!editing) renderMain(); }
  };
  if (it.line) el.ondblclick = e => { if (!editing) { e.preventDefault(); sel = i; editLine(it); } };
  if (it.adding || editing && editing.item === itemId(it)) { el.appendChild(renderEditor()); return el; }
  if (it.line) {
    const l = it.line, rev = reviewed(l);
    if (rev) el.classList.add("rev");
    el.appendChild(drawBubble(l.text, l.tone));
    const right = document.createElement("div");
    const rows = bubbleRows(l.text).length, probs = problems(l);
    right.innerHTML = `<div class="words">${esc(l.text)}</div><div class="meta">${chips(l.conds, l.tone)}
      ${rev ? `<span class="tick">✓ reviewed</span>` : `<span class="flag">● unreviewed</span>`}
      ${rows > 3 ? `<span class="flag">${rows} rows</span>` : ""}
      ${probs.map(p => `<span class="flag bad">${esc(p)}</span>`).join("")}
      ${l.comment ? `<span class="stats">${esc(l.comment)}</span>` : ""}</div>
      ${i === sel || filt.explain ? explain(l.conds, l.tone) : ""}
      ${i === sel ? `<div class="acts lineacts"><button data-a="edit" class="primary">Edit (Enter)</button>
        <button data-a="review">${rev ? "Not reviewed" : "Reviewed"} (r)</button><button data-a="delete">Delete (d)</button></div>` : ""}`;
    right.onclick = e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (a === "edit") editLine(it);
      if (a === "review") toggleReview(it);
      if (a === "delete") deleteLine(it);
    };
    if (it.draft) right.appendChild(renderDraft(it.draft, l));
    el.appendChild(right);
  } else {
    const d = it.draft;
    const w = draftWords(d) || [];
    const s = splitWords(w);
    el.appendChild(d.delete ? document.createElement("span") : drawBubble(d.text || "", s.tone));
    const right = document.createElement("div");
    right.innerHTML = `<div class="words" style="color:var(--plead)">${d.old ? "⚠ Draft for a line no longer in the file: " + esc(d.old) : "New line drafted"}</div>`;
    right.appendChild(renderDraft(d, null));
    el.appendChild(right);
  }
  return el;
}
function renderDraft(d, line) {
  const box = document.createElement("div");
  box.className = "draft";
  const w = draftWords(d);
  const s = w ? splitWords(w) : line ? { conds: line.conds, tone: line.tone } : { conds: [], tone: "" };
  if (d.delete) {
    box.innerHTML = `<div></div><div><div class="words" style="color:var(--rude)">Draft: delete this line</div>`;
  } else {
    box.appendChild(drawBubble(d.text || "", s.tone));
    const t = document.createElement("div");
    t.innerHTML = `<div class="words">${esc((d.text || "").toUpperCase())}</div><div class="meta">${chips(s.conds, s.tone)}
      ${w && line && w.slice().sort().join(" ") !== line.conds.concat(line.tone ? [line.tone] : []).sort().join(" ") ? `<span class="flag">conditions change</span>` : ""}</div>`;
    box.appendChild(t);
  }
  const t = box.lastChild;
  if (d.note) t.insertAdjacentHTML("beforeend", `<div class="note">${esc(d.note)}</div>`);
  const acts = document.createElement("div"); acts.className = "acts";
  const canAccept = !d.old || d.found;
  acts.innerHTML = `${canAccept ? `<button class="primary" data-a="accept">Accept (y)</button>${d.delete ? "" : `<button data-a="edit">Edit then accept (Y)</button>`}` : ""}
    <button data-a="reject">Reject (x)</button>`;
  acts.onclick = e => {
    const a = e.target.dataset.a;
    if (a === "accept") acceptDraft(d, s);
    if (a === "edit") startEdit("accept", d, s.conds, s.tone, d.text);
    if (a === "reject") op({ op: "reject", id: d.id });
  };
  t.appendChild(acts);
  return box;
}
function acceptDraft(d, s) {
  return op({ op: "accept", id: d.id, conds: s.conds, tone: s.tone, text: d.text || "" });
}
function wireHead() {
  const ch = $("chance");
  if (ch) ch.onchange = () => op({ op: "chance", moment: current, chance: ch.value.trim() === "" ? null : ch.value.trim() });
  if ($("addBtn")) $("addBtn").onclick = () => startAdd();
  if ($("revAll")) $("revAll").onclick = () => reviewAll();
}

// ---- The editor ----
function startEdit(kind, target, conds, tone, text) {
  const it = items[sel];
  const m = kind === "accept" ? moment(target.moment) : it.m;
  editing = { kind, item: kind === "accept" ? itemIdForDraft(target) : itemId(it), target, conds: conds.join(" "), tone, text, m };
  renderMain();
}
function itemIdForDraft(d) {
  const it = items.find(it => it.draft === d);
  return it ? itemId(it) : null;
}
function startAdd() {
  if (filt.search) return toast("Clear the search to add a line to one moment.");
  editing = { kind: "add", m: moment(current), conds: "", tone: "", text: "" };
  renderMain();
  sel = items.length - 1;
  renderMain();
}
function renderEditor() {
  const ed = document.createElement("div");
  ed.className = "editor";
  ed.innerHTML = `<div class="prev"></div>
    <div class="fields">
      <span>words</span><input class="w" id="edWords" autocomplete="off" spellcheck="true">
      <span>conditions</span><input id="edConds" autocomplete="off" spellcheck="false" placeholder="e.g. hungry !friend">
      <span></span><div class="sugg" id="edSugg"></div>
      <span></span><div id="edSuggWhy"></div>
      <span>tone</span><div class="tones" id="edTones"></div>
    </div>
    <div class="meta"><button class="primary" id="edSave">Save (Enter)</button><button id="edCancel">Cancel (Esc)</button>
      <button id="edRef" type="button">All conditions…</button>
      <span class="stats" id="edInfo"></span></div>
    <div id="edWhy"></div>`;
  const words = ed.querySelector("#edWords"), conds = ed.querySelector("#edConds");
  words.value = editing.text; conds.value = editing.conds;
  const tones = ed.querySelector("#edTones");
  for (const t of book.tones) {
    const b = document.createElement("button");
    const key = t === "plain" ? "" : t;
    b.textContent = t; b.type = "button";
    b.style.borderColor = `rgb(${TONE_RGB[key]})`;
    b.onclick = () => { editing.tone = key; update(); };
    b.dataset.t = key;
    tones.appendChild(b);
  }
  let hi = 0;
  function suggestions() {
    const parts = conds.value.split(" "), last = parts[parts.length - 1];
    if (!last || document.activeElement !== conds) return [];
    const neg = last.startsWith("!"), q = last.replace(/^!/, "");
    const have = new Set(parts.slice(0, -1).map(p => p.replace(/^!/, "")));
    const all = book.conds.filter(c => !have.has(c) && c !== q);
    return all.filter(c => c.startsWith(q)).concat(all.filter(c => !c.startsWith(q) && c.includes(q))).slice(0, 14).map(c => (neg ? "!" : "") + c);
  }
  function pick(s) {
    const parts = conds.value.split(" "); parts[parts.length - 1] = s;
    conds.value = parts.join(" ") + " "; hi = 0; update(); conds.focus();
  }
  function update() {
    editing.text = words.value; editing.conds = conds.value;
    const prev = ed.querySelector(".prev"); prev.innerHTML = "";
    prev.appendChild(drawBubble(words.value, editing.tone));
    for (const b of tones.children) {
      const on = b.dataset.t === editing.tone;
      b.classList.toggle("on", on);
      b.style.background = on ? `rgb(${TONE_RGB[b.dataset.t]})` : "";
    }
    const sg = ed.querySelector("#edSugg"); sg.innerHTML = "";
    suggestions().forEach((s, i) => {
      const c = document.createElement("span"); c.className = "chip" + (i === hi ? " hi" : ""); c.textContent = s;
      c.onmousedown = e => { e.preventDefault(); pick(s); };
      c.onmouseenter = () => { hi = i; update(); };
      sg.appendChild(c);
    });
    const shown = suggestions()[hi];
    ed.querySelector("#edSuggWhy").textContent = shown ? shown + ": " + meaningOf(shown) : "";
    const cs = conds.value.split(/\s+/).filter(Boolean);
    const bad = cs.filter(c => !book.conds.includes(c.replace(/^!/, "")) && !book.tones.includes(c));
    const rows = bubbleRows(words.value).length;
    const slotBad = (words.value.toUpperCase().match(/\{[^}]*\}?/g) || []).filter(s => !(s in FILL));
    const charBad = /[#@|]/.test(words.value);
    ed.querySelector("#edInfo").innerHTML = [
      rows + (rows === 1 ? " row" : " rows") + (rows > 3 ? " (long)" : ""),
      bad.length ? `<span class="flag bad">unknown: ${esc(bad.join(" "))}</span>` : "",
      slotBad.length ? `<span class="flag bad">names are {NAME} {ME} {WHO} {THING} {N}</span>` : "",
      charBad ? `<span class="flag bad"># @ | can't be used</span>` : "",
    ].filter(Boolean).join(" · ");
    ed.querySelector("#edWhy").innerHTML = explain(cs.filter(c => !book.tones.includes(c)), cs.find(c => book.tones.includes(c)) || editing.tone);
  }
  words.oninput = update;
  conds.oninput = () => { hi = 0; update(); };
  conds.onfocus = conds.onblur = () => update();
  conds.onkeydown = e => {
    const s = suggestions();
    const parts = conds.value.split(" "), last = parts[parts.length - 1].replace(/^!/, "");
    const whole = book.conds.includes(last) || book.tones.includes(last);
    if ((e.key === "Tab" || e.key === "Enter" && !whole) && s.length && !e.ctrlKey) { e.preventDefault(); pick(s[hi]); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowRight" && conds.selectionStart === conds.value.length && s.length) { if (s.length) { e.preventDefault(); hi = (hi + 1) % s.length; update(); } return; }
    if (e.key === "ArrowUp" && s.length) { e.preventDefault(); hi = (hi + s.length - 1) % s.length; update(); return; }
    if (e.key === "Enter") { e.preventDefault(); save(); }
    if (e.key === "Escape") { e.preventDefault(); cancel(); }
  };
  words.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); save(); }
    if (e.key === "Escape") { e.preventDefault(); cancel(); }
  };
  ed.querySelector("#edSave").onclick = save;
  ed.querySelector("#edCancel").onclick = cancel;
  ed.querySelector("#edRef").onclick = () => showConditions(name => {
    const sep = conds.value === "" || conds.value.endsWith(" ") ? "" : " ";
    if (book.tones.includes(name)) editing.tone = name === "plain" ? "" : name;
    else conds.value += sep + name + " ";
    update(); conds.focus();
  });
  update();
  setTimeout(() => { words.focus(); words.setSelectionRange(words.value.length, words.value.length); }, 0);
  return ed;
}
function editLine(it) { startEdit("edit", it.line, it.line.conds, it.line.tone, it.line.text); }
async function toggleReview(it) {
  await op({ op: "review", keys: [it.line.key], on: !reviewed(it.line) });
  sel = Math.min(items.length - 1, sel + 1); renderMain();
}
function deleteLine(it) {
  if (confirm("Delete this line?\n\n" + it.line.text)) op({ op: "delete", moment: it.m.name, row: it.line.row, raw: it.line.raw });
}
function cancel() { editing = null; load(); }
async function save() {
  const e = editing;
  const cs = e.conds.split(/\s+/).filter(Boolean);
  const tone = cs.find(c => book.tones.includes(c)) || e.tone;
  const conds = cs.filter(c => !book.tones.includes(c));
  let ok;
  if (e.kind === "edit") ok = await op({ op: "edit", moment: e.m.name, row: e.target.row, raw: e.target.raw, conds, tone, text: e.text });
  else if (e.kind === "add") {
    const last = e.m.lines[e.m.lines.length - 1];
    ok = await op({ op: "add", moment: e.m.name, conds, tone, text: e.text, after: last ? { row: last.row, raw: last.raw } : null });
  } else ok = await op({ op: "accept", id: e.target.id, conds, tone, text: e.text });
  if (ok) {
    editing = null;
    renderMain();
    const words = e.text.toUpperCase().split(/\s+/).filter(Boolean).join(" ");
    const at = items.findIndex(it => it.line && it.m.name === e.m.name && it.line.text === words);
    if (at >= 0) { sel = at; renderMain(); }
  }
}
function reviewAll() {
  const m = moment(current); if (!m) return;
  const on = m.lines.some(l => !reviewed(l));
  op({ op: "review", keys: m.lines.map(l => l.key), on });
}

// ---- Keys ----
function showMoment(name) {
  editing = null; filt.search = ""; $("search").value = "";
  current = name; sel = 0; render(); $("main").scrollTop = 0;
}
function nextMoment(step) {
  const vis = visibleMoments();
  let i = vis.findIndex(m => m.name === current);
  i = Math.max(0, Math.min(vis.length - 1, i + step));
  if (vis[i]) showMoment(vis[i].name);
}
function nextUnreviewed() {
  const ms = book.moments;
  let mi = Math.max(0, ms.findIndex(m => m.name === current));
  const it = items[sel];
  let li = it && it.line ? it.m.lines.indexOf(it.line) + 1 : 0;
  for (let n = 0; n <= ms.length; n++) {
    const m = ms[(mi + n) % ms.length];
    const k = m.lines.findIndex((l, i) => i >= (n === 0 ? li : 0) && !reviewed(l));
    if (k >= 0) {
      filt.search = ""; $("search").value = "";
      current = m.name; render();
      sel = items.findIndex(x => x.line === m.lines[k]); render();
      return;
    }
  }
  toast("Every line is reviewed.", true);
}
document.addEventListener("keydown", e => {
  if (window.diagramKeys && window.diagramKeys(e)) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") {
    if (e.target.id === "search" && (e.key === "Escape" || e.key === "Enter")) { if (e.key === "Escape") { e.target.value = ""; filt.search = ""; render(); } e.target.blur(); }
    return;
  }
  if ($("help").style.display === "block") { if (e.key === "Escape" || e.key === "?") $("help").style.display = "none"; return; }
  if (editing || e.ctrlKey || e.metaKey || e.altKey) return;
  const it = items[sel];
  const k = e.key;
  const go = f => { e.preventDefault(); f(); };
  if (k === "j" || k === "ArrowDown") go(() => { sel = Math.min(items.length - 1, sel + 1); renderMain(); });
  else if (k === "k" || k === "ArrowUp") go(() => { sel = Math.max(0, sel - 1); renderMain(); });
  else if (k === "J" || k === "]" || k === "PageDown") go(() => nextMoment(1));
  else if (k === "K" || k === "[" || k === "PageUp") go(() => nextMoment(-1));
  else if ((k === "Enter" || k === "e") && it && it.line) go(() => editLine(it));
  else if (k === "a") go(startAdd);
  else if (k === "r" && it && it.line) go(() => toggleReview(it));
  else if (k === "R") go(reviewAll);
  else if (k === "n") go(nextUnreviewed);
  else if ((k === "d" || k === "Delete") && it && it.line) go(() => deleteLine(it));
  else if (k === "y" && it && it.draft && (!it.draft.old || it.draft.found)) go(() => {
    const w = draftWords(it.draft); acceptDraft(it.draft, w ? splitWords(w) : it.line ? { conds: it.line.conds, tone: it.line.tone } : { conds: [], tone: "" });
  });
  else if (k === "Y" && it && it.draft && !it.draft.delete) go(() => {
    const w = draftWords(it.draft); const s = w ? splitWords(w) : it.line ? { conds: it.line.conds, tone: it.line.tone } : { conds: [], tone: "" };
    startEdit("accept", it.draft, s.conds, s.tone, it.draft.text);
  });
  else if (k === "x" && it && it.draft) go(() => op({ op: "reject", id: it.draft.id }));
  else if (k === "/") go(() => $("search").focus());
  else if (k === "?") go(showHelp);
  else if (k === "c") go(() => showConditions());
  else if (k === "t") go(() => showDiagram(true));
  else if (k === "Escape" && filt.search) go(() => { filt.search = ""; $("search").value = ""; render(); });
});
function showHelp() {
  $("help").innerHTML = `<h2>Keys</h2><div class="keys">
    <kbd>j</kbd> <kbd>k</kbd><span>next, previous line (or the arrows)</span>
    <kbd>]</kbd> <kbd>[</kbd><span>next, previous moment (or J K, Page Down/Up)</span>
    <kbd>Enter</kbd> <kbd>e</kbd><span>edit the line (or double-click it, or its Edit button). Enter saves, Esc cancels. In conditions, Tab or Enter takes the highlighted suggestion, arrows move it</span>
    <kbd>a</kbd><span>add a line to this moment</span>
    <kbd>r</kbd><span>mark the line reviewed (or not) and go to the next; editing a line marks it reviewed too</span>
    <kbd>R</kbd><span>mark the whole moment reviewed (or not)</span>
    <kbd>n</kbd><span>go to the next unreviewed line, in any moment</span>
    <kbd>d</kbd><span>delete the line</span>
    <kbd>y</kbd> <kbd>Y</kbd> <kbd>x</kbd><span>accept Claude's draft, edit it then accept, reject it</span>
    <kbd>/</kbd><span>search; Esc clears it</span>
    <kbd>t</kbd><span>the DIAGRAM tab: every moment, what makes it said, what it does and what can follow; in it f focuses, o goes back to the overview, b steps back, l opens the lines, t comes back here</span>
    <kbd>c</kbd><span>every condition and tone in plain words; hover a chip for one, and the selected line reads its own out</span>
  </div>
  <h2>The bubble</h2><pre>Drawn in the game's own font at its wrap width (96 px) and edged in the tone's colour, at twice its size. Names are filled with stand-ins: ${Object.entries(FILL).map(([k, v]) => k + " " + v).join(", ")}.</pre>
  <h2>From the top of data/lines.txt</h2><pre>${esc(book.header.join("\n"))}</pre><p class="stats">Esc closes this.</p>`;
  $("help").style.display = "block";
}

/// Every condition and tone in plain words, searchable. Given pick, a click
/// on one hands it to pick (the editor adds it to the line) and closes.
function showConditions(pick) {
  const box = $("help");
  box.innerHTML = `<div class="ref${pick ? " picking" : ""}"><h2>Conditions and tones${pick ? ": click one to add it" : ""}</h2>
    <input id="refSearch" placeholder="Filter by name or meaning" autocomplete="off">
    <div id="refList"></div><p class="stats">Put ! in front of a condition for its opposite. Esc closes this.
    The words come from tools/lines_editor/conditions.txt.</p></div>`;
  const list = box.querySelector("#refList"), q = box.querySelector("#refSearch");
  const missing = book.conds.filter(c => !meaning[c]);
  function draw() {
    const f = q.value.trim().toLowerCase();
    let h = missing.length ? `<div class="warnbox">No description yet: ${esc(missing.join(", "))}</div>` : "";
    for (const g of book.meanings) {
      const rows = g.items.filter(([n, t]) => !f || n.includes(f) || t.toLowerCase().includes(f));
      if (!rows.length) continue;
      h += `<h3>${esc(g.title)}</h3>` + rows.map(([n, t]) => `<div class="r" data-n="${esc(n)}"><b>${esc(n)}</b><span>${esc(t)}</span></div>`).join("");
    }
    list.innerHTML = h || `<div class="empty">Nothing matches.</div>`;
  }
  q.oninput = draw;
  q.onkeydown = e => { if (e.key === "Escape") { e.preventDefault(); q.blur(); box.style.display = "none"; } };
  list.onclick = e => {
    const r = e.target.closest(".r");
    if (r && pick) { q.blur(); box.style.display = "none"; pick(r.dataset.n); }
  };
  draw();
  box.style.display = "block";
  q.focus();
}
$("refBtn").onclick = () => showConditions();
$("helpBtn").onclick = showHelp;
$("help").onclick = e => { if (e.target === $("help")) { document.activeElement.blur(); $("help").style.display = "none"; } };
$("search").value = filt.search;
$("fUnrev").checked = filt.unrev; $("fDrafts").checked = filt.drafts;
$("search").oninput = e => { filt.search = e.target.value.trim(); sel = 0; render(); };
$("fUnrev").onchange = e => { filt.unrev = e.target.checked; render(); };
$("fDrafts").onchange = e => { filt.drafts = e.target.checked; render(); };
$("fExplain").checked = !!filt.explain;
$("fExplain").onchange = e => { filt.explain = e.target.checked; render(); };
$("list").onclick = e => {
  const m = e.target.closest(".mom"); if (!m) return;
  showMoment(m.dataset.m);
};
loadFont().then(load).then(poll).catch(e => { document.body.textContent = "Couldn't load: " + e; });
</script>
<script src="diagram.js"></script>
</body>
</html>
